version: "3.8"

services:
  # ------------------------------------------------------------------
  # FastAPI backend — GPU-enabled for XGBoost / GNN training & scoring.
  # ------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aegis-backend
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./sql:/app/sql
      - ./simulation:/app/simulation
      - ./ml:/app/ml
    # Uncomment on a machine with NVIDIA Container Toolkit installed:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    networks:
      - aegis-net

  # ------------------------------------------------------------------
  # React "War Room" frontend.
  # ------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aegis-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE=http://localhost:8000
    networks:
      - aegis-net

networks:
  aegis-net:
    driver: bridge
