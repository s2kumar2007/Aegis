services:
  # ----------------------------------------------------------------
  # Exasol Community Edition
  # ----------------------------------------------------------------
  exasol:
    image: exasol/nano:2026.2.0-nano.3-amd64
    container_name: aegis-exasol
    privileged: true
    ports:
      - "8563:8563"
    environment:
      - EXA_DB_PASSWORD=exasol
    volumes:
      - exasol_data:/exa
    networks:
      - aegis-net

  # ----------------------------------------------------------------
  # Schema init — runs SQL files once after Exasol is up
  # ----------------------------------------------------------------
  db-init:
    image: python:3.11-slim
    container_name: aegis-db-init
    depends_on:
      - exasol
    environment:
      - EXASOL_HOST=exasol
      - EXASOL_PORT=8563
      - EXASOL_USER=sys
      - EXASOL_PASSWORD=exasol
    volumes:
      - ./sql:/sql
      - ./init_db.py:/init_db.py
    command: bash -c "pip install pyexasol -q && python /init_db.py"
    networks:
      - aegis-net

  # ----------------------------------------------------------------
  # FastAPI backend
  # ----------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aegis-backend
    depends_on:
      - db-init
    environment:
      - PYTHONUNBUFFERED=1
      - EXASOL_HOST=exasol
      - EXASOL_PORT=8563
      - EXASOL_USER=sys
      - EXASOL_PASSWORD=exasol
      - EXASOL_SCHEMA=AEGIS
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./sql:/app/sql
      - ./simulation:/app/simulation
      - ./ml:/app/ml
    networks:
      - aegis-net

  # ----------------------------------------------------------------
  # React frontend (Art Edition)
  # ----------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aegis-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE=http://localhost:8000
    networks:
      - aegis-net

networks:
  aegis-net:
    driver: bridge

volumes:
  exasol_data:
